<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="streamGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="streamGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.7" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: url(#titleGrad);
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #e2e8f0;
    }
    .tagline {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 15px;
      fill: #94a3b8;
    }
    
    /* Dynamic Wave Animations */
    @keyframes waveMove1 {
      0% { transform: translateX(0); }
      50% { transform: translateX(-60px); }
      100% { transform: translateX(0); }
    }
    @keyframes waveMove2 {
      0% { transform: translateX(0); }
      50% { transform: translateX(80px); }
      100% { transform: translateX(0); }
    }
    @keyframes pulseParticle {
      0%, 100% { opacity: 0.3; transform: scale(0.9); }
      50% { opacity: 0.9; transform: scale(1.2); }
    }

    .wave1 { animation: waveMove1 12s ease-in-out infinite; }
    .wave2 { animation: waveMove2 16s ease-in-out infinite; }
    .particle { animation: pulseParticle 4s ease-in-out infinite; }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- Background Grid Pattern -->
  <g opacity="0.12" stroke="#64748b" stroke-width="1">
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200" />
    <path d="M150 0 V360 M300 0 V360 M450 0 V360 M600 0 V360 M750 0 V360 M900 0 V360 M1050 0 V360" />
  </g>

  <!-- Dynamic / Animated Streaming Flow Lines (Background Layers) -->
  <g opacity="0.45" filter="url(#glow)">
    <!-- Stream Wave 1 -->
    <path class="wave1" d="M-100 280 Q 200 200, 500 270 T 1100 240 Q 1250 220, 1350 260" fill="none" stroke="url(#streamGrad1)" stroke-width="5" stroke-dasharray="12 8" />
    <!-- Stream Wave 2 -->
    <path class="wave2" d="M-50 310 Q 300 350, 650 280 T 1200 310" fill="none" stroke="url(#streamGrad2)" stroke-width="4" />
  </g>

  <!-- Floating Glowing Event Stream Nodes -->
  <g class="particle" opacity="0.7">
    <circle cx="200" cy="250" r="6" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="450" cy="275" r="8" fill="#818cf8" filter="url(#glow)" />
    <circle cx="750" cy="245" r="5" fill="#ec4899" filter="url(#glow)" />
    <circle cx="980" cy="290" r="7" fill="#10b981" filter="url(#glow)" />
  </g>

  <!-- Foreground Content Card Overlay (Semi-transparent backdrop for maximum readability) -->
  <rect x="50" y="45" width="1100" height="270" rx="12" fill="#0f172a" fill-opacity="0.75" stroke="#334155" stroke-width="1.5" />

  <!-- Title & Text (In Foreground, guaranteed visible) -->
  <g text-anchor="middle">
    <!-- Icon / Badge -->
    <rect x="530" y="70" width="140" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="600" y="89" font-family="sans-serif" font-size="12" font-weight="600" fill="#38bdf8" letter-spacing="1">⚡ APACHE FLINK</text>

    <!-- Main Title -->
    <text x="600" y="145" class="title" filter="url(#glow)">Awesome Real-Time Stream Processing</text>

    <!-- Subtitle -->
    <text x="600" y="190" class="subtitle">Curated Ecosystem of SaaS Platforms &amp; Open-Source Engines</text>

    <!-- Tagline & Focus -->
    <text x="600" y="235" class="tagline">Managed Flink • Stateful Computation • Event-Time Processing • Streaming SQL • CDC</text>

    <!-- Decorative pill tags -->
    <g transform="translate(360, 260)">
      <rect x="0" y="0" width="110" height="24" rx="12" fill="#0284c7" fill-opacity="0.2" stroke="#0284c7" stroke-width="1"/>
      <text x="55" y="16" font-family="sans-serif" font-size="11" fill="#38bdf8" font-weight="600">Apache Flink</text>

      <rect x="125" y="0" width="110" height="24" rx="12" fill="#6366f1" fill-opacity="0.2" stroke="#6366f1" stroke-width="1"/>
      <text x="180" y="16" font-family="sans-serif" font-size="11" fill="#a5b4fc" font-weight="600">Kafka Streams</text>

      <rect x="250" y="0" width="110" height="24" rx="12" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1"/>
      <text x="305" y="16" font-family="sans-serif" font-size="11" fill="#6ee7b7" font-weight="600">Streaming SQL</text>

      <rect x="375" y="0" width="105" height="24" rx="12" fill="#ec4899" fill-opacity="0.2" stroke="#ec4899" stroke-width="1"/>
      <text x="427" y="16" font-family="sans-serif" font-size="11" fill="#f472b6" font-weight="600">Debezium CDC</text>
    </g>
  </g>
</svg>
